spring.application.name=scholar-track-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/scholartrack
spring.datasource.username=scholartrack
spring.datasource.password=scholartrack

# Creates/updates tables to match the entities automatically - fine for a
# personal local project. Swap for a proper migration tool (Flyway/Liquibase)
# if this ever needs a real, reviewable schema history.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# So AuthController's ResponseStatusException reasons (e.g. "Incorrect
# username or password.") reach the frontend instead of being stripped.
server.error.include-message=always
