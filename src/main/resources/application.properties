spring.application.name=scholar-track-backend

# Cloud Run injects PORT; defaults to 8080 for local dev.
server.port=${PORT:8080}
# So session cookies/redirects come out correct when a reverse proxy (Cloud
# Run's own) terminates HTTPS in front of this app and forwards plain HTTP.
server.forward-headers-strategy=framework

# All three default to the same values the local Docker Postgres container
# uses, so local dev needs zero setup - deployment just sets these three
# env vars to point at the real database instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scholartrack}
spring.datasource.username=${DB_USERNAME:scholartrack}
spring.datasource.password=${DB_PASSWORD:scholartrack}

# Creates/updates tables to match the entities automatically - fine for a
# personal local project. Swap for a proper migration tool (Flyway/Liquibase)
# if this ever needs a real, reviewable schema history.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# So AuthController's ResponseStatusException reasons (e.g. "Incorrect
# username or password.") reach the frontend instead of being stripped.
server.error.include-message=always
